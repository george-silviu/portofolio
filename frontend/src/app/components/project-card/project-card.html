<div class="project__card">
    <div class="project__header">
        <div class="project__icon">
            <svg data-p-icon="code" [size]="24"></svg>
        </div>
        <div class="project__title">
            <span class="project__name">
                Formkit Studio
            </span>
            <small class="project__role">
                2025 - Lead developer
            </small>
        </div>
        <div class="project__status">
            <span class="status__chip">
                Activ
            </span>
        </div>
    </div>
    <p class="project__desc">
        Drag-and-drop JSON form builder with schema validation an live preview
    </p>
    <div class="project__tags">
        <div class="tag">TypeScript</div>
        <div class="tag">React</div>
        <div class="tag">JsonSchema</div>
        <div class="tag">Node.js</div>
    </div>
</div>
